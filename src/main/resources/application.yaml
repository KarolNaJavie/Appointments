spring:
  application:
    name: ApointmentManager
  datasource:
    url: jdbc:mysql://localhost:3306/appointments_db_schema
    username: root
    password: root
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.orm.jdbc.bind: TRACE